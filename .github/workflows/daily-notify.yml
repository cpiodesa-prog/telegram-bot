name: Щоденне сповіщення про сесії/виконком/комісії ОМР

on:
  schedule:
    # 10:00 та 16:30 за Києвом. Cron працює в UTC і НЕ підлаштовується під
    # перехід на літній/зимовий час — тут вказано час для літнього (UTC+3,
    # діє зараз, з березня по жовтень). На зимовий час (UTC+2, з кінця
    # жовтня) ці ж рядки відповідатимуть 11:00 і 17:30 за Києвом — якщо
    # важлива точність, зсунути на годину назад (07:00 -> "0 7 * * *" тощо).
    - cron: "0 7 * * *"    # ~10:00 Київ (літній час)
    - cron: "30 13 * * *"  # ~16:30 Київ (літній час)
  workflow_dispatch:      # можливість запустити вручну з вкладки Actions
    inputs:
      dry_run:
        description: "Тестовий прогін (--dry-run): нічого не шле в Telegram, тільки друкує знайдене в лог"
        type: boolean
        default: false

permissions:
  contents: write   # потрібно, щоб закомітити оновлений state/seen.json

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_daily.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit updated state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "oms-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json
          # publish_delays.csv з'являється лише після першого залогованого
          # випадку затримки публікації — на "-e" шелу git add на
          # неіснуючий файл впав би, тому додаємо його, лише якщо він є
          [ -f state/publish_delays.csv ] && git add state/publish_delays.csv || true
          git diff --cached --quiet || git commit -m "state: оновлено список надісланих подій"
          # якщо хтось запушив у main, поки цей job працював — підтягнути й спробувати ще раз,
          # щоб не падати з "rejected" і не втрачати щойно надісланий стан
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push не вдався, спроба $i, повторюю..."
            sleep 5
          done
